services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: astraflare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: astraflare_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d astraflare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
